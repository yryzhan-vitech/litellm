name: Build and push ECR image

on:
  # Auto-build only when image content changes — docs/tests/CI don't affect the image
  push:
    branches:
      - main
      # Versioned patch-stack branches (one ARC-BUG per commit, base v1.94.0+).
      # These are what dev-ai actually runs, so a push here should produce an
      # image without a manual dispatch. A push lands an immutable
      # <branch>-<sha> tag in the provisioning hub (246511608293), which
      # replicates to every spoke — including 258174056699 (dev-ai) and
      # 572630832277 (prd-ai).
      #
      # Two patterns, both live:
      #   arcadia-v*       current naming, one branch per upstream release
      #                    (arcadia-v1.94.0, arcadia-v1.95.0, ...)
      #   arcadia-clean-*  previous naming, kept so the rc.3-based
      #                    arcadia-clean-v1.94 branch still builds during and
      #                    after the migration. Remove once nothing tracks it.
      - 'arcadia-v*'
      - 'arcadia-clean-*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tests/**'
      # `.github/**` deliberately NOT ignored: a change to this workflow (build
      # args, tag scheme, base image) changes what gets produced, so it must be
      # buildable without a manual dispatch. Costs an occasional no-op rebuild
      # when only CI metadata changes — acceptable versus silently shipping a
      # stale image after a build-logic edit.
      - '.circleci/**'
      - 'cookbook/**'
      - 'ui/**/*.test.*'
  # Manual trigger for re-runs or emergency rebuilds
  workflow_dispatch:
    inputs:
      extra_tag:
        description: 'Additional tag to apply (e.g. noma-v2-cache-cost-fix). Optional.'
        required: false
        type: string

permissions:
  contents: read
  id-token: write  # OIDC federation to AWS for ECR push

jobs:
  build:
    name: Build and push force-multiplier/litellm
    runs-on: ubuntu-latest
    # Gate on our own shipping branches. PRs and one-off feature branches must
    # not push; `main` (legacy prod lineage), `arcadia-v*` (current naming) and
    # `arcadia-clean-*` (previous naming) may, plus any manual dispatch. Keep
    # this in sync with the `push` branch filter above — the filter decides what
    # triggers, this decides what is allowed to push, and a dispatch can target
    # any ref, so this gate is the real authority.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/heads/arcadia-v')
      || startsWith(github.ref, 'refs/heads/arcadia-clean-')

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 246511608293.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPO: force-multiplier/litellm

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0  # Need full history for meaningful SHA
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Configure AWS credentials (OIDC federation)
        # Pushes to the PROVISIONING HUB account 246511608293 (ECR_REGISTRY above),
        # whose registry replication has no repository filters and fans out to
        # every spoke — 258174056699 (dev-ai), 572630832277 (prd-ai),
        # 319859009076, 498769975733, 211125583766. That is why building here is
        # sufficient: no per-account build or manual copy is needed for images.
        #
        # ⚠️ Corrected 2026-07-29: this comment previously claimed the role is
        # `github-actions-arcadia-litellm-ecr` with trust scoped to
        # `refs/heads/main`. Both were wrong. That role exists but has never been
        # used (RoleLastUsed empty). AWS_ECR_ROLE_ARN actually resolves to
        # `AllowToPushToECR` (roleId AROATSZJ4UHSW5KB3UBG6, confirmed from the
        # run-30464830709 log), whose trust condition is `repo:arcadia/*` — any
        # branch of any arcadia repo. So no IAM change was needed to build from
        # `arcadia-clean-*`; the only gate was this workflow's own branch filter.
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2.1.6

      # The Dockerfile pulls its build and runtime base from
      # cgr.dev/chainguard/wolfi-base, pinned BY DIGEST. Chainguard's public registry
      # serves anonymous pulls but rate-limits them, so the org pull token is a
      # reliability measure, not an access requirement.
      #
      # continue-on-error because the token is not load-bearing and its failure must not
      # block a build. Measured 2026-08-10 after this step returned
      # `cgr.dev/v2/: denied: FORBIDDEN` and failed the run before `docker build` even
      # started: an anonymous bearer token from cgr.dev/token reads the pinned digest's
      # manifest with HTTP 200. So on a bad or expired token the build now falls through
      # to an anonymous pull instead of failing outright.
      #
      # ⚠️ This does NOT remove the cgr.dev dependency — the `FROM` lines still resolve
      # there. It only stops a credential problem from being a build outage. If pulls
      # start failing anonymously too (rate limit), fix the token; the step's outcome is
      # visible in the run summary rather than silent.
      - name: Login to Chainguard registry
        continue-on-error: true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: cgr.dev
          username: ${{ secrets.CHAINGUARD_PULL_TOKEN_USERNAME }}
          password: ${{ secrets.CHAINGUARD_PULL_TOKEN_SECRET }}

      - name: Compute tags
        id: tags
        # extra_tag is passed via env (never interpolated into the script body)
        # so a crafted dispatch input cannot inject shell commands.
        env:
          EXTRA_TAG: ${{ inputs.extra_tag }}
        run: |
          SHORT_SHA=$(git rev-parse --short=10 HEAD)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          # Prefix the SHA tag with the branch so provenance is readable from the
          # tag alone. `main-<sha>` is the legacy prod lineage (v1.88 patchstack)
          # and MUST keep that exact shape — prd-ai runs `main-a2e1b93d30` today.
          # A clean-stack build must not masquerade as it, so derive the prefix
          # from the ref rather than hardcoding `main`. Non-alphanumerics are
          # squashed to `-` because Docker tags allow only [A-Za-z0-9_.-].
          REF_NAME="${GITHUB_REF#refs/heads/}"
          TAG_PREFIX=$(printf '%s' "${REF_NAME}" | tr -c 'A-Za-z0-9_.-' '-')
          echo "tag_prefix=${TAG_PREFIX}" >> "$GITHUB_OUTPUT"
          # Only publish the commit SHA tag (immutable, traceable). Deliberately
          # NOT moving `latest` or any named alias — consumers that depend on
          # specific tags (e.g. the current `noma-v2-complete-fix` deployment)
          # must not have them reinterpreted underfoot by subsequent builds.
          # To cut a named release, run workflow_dispatch with extra_tag set.
          #
          # NEVER reuse an existing tag: `imagePullPolicy: IfNotPresent` means
          # pods keep the digest they already have, so a rebuilt tag runs the OLD
          # code while every doc claims otherwise. This bit us on
          # arcadia-v1.94.0-rc.3-v21. Verify rollouts by pod imageID digest.
          TAG_LIST="${ECR_REGISTRY}/${ECR_REPO}:${TAG_PREFIX}-${SHORT_SHA}"
          if [ -n "${EXTRA_TAG}" ]; then
            TAG_LIST="${TAG_LIST},${ECR_REGISTRY}/${ECR_REPO}:${EXTRA_TAG}"
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${TAG_LIST}" | tr ',' '\n' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # BuildKit cache via GitHub Actions cache backend — keeps subsequent
          # builds under 2min once the first one populates the cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Summary
        # short_sha / extra_tag passed via env (never interpolated into the
        # script body) so neither can inject shell commands into the summary.
        env:
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
          TAG_PREFIX: ${{ steps.tags.outputs.tag_prefix }}
          EXTRA_TAG: ${{ inputs.extra_tag }}
        run: |
          echo "## Image pushed to ECR" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repo**: \`${ECR_REGISTRY}/${ECR_REPO}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Primary tag**: \`${TAG_PREFIX}-${SHORT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${EXTRA_TAG}" ]; then
            echo "- **Also tagged**: \`${EXTRA_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No extra tag applied." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed to the provisioning hub (\`246511608293\`), which replicates to" >> "$GITHUB_STEP_SUMMARY"
          echo "every spoke account — \`258174056699\` (dev-ai), \`572630832277\` (prd-ai)," >> "$GITHUB_STEP_SUMMARY"
          echo "\`319859009076\`, \`498769975733\`, \`211125583766\`. Replication takes ~1min;" >> "$GITHUB_STEP_SUMMARY"
          echo "verify with \`aws ecr describe-images --profile <acct>\` before deploying." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "To deploy, set \`proxy.image.tag\` to \`${TAG_PREFIX}-${SHORT_SHA}\` in the" >> "$GITHUB_STEP_SUMMARY"
          echo "target env's CCI file, e.g." >> "$GITHUB_STEP_SUMMARY"
          echo "\`preprd/dev-ai/litellm-internal/application.yaml\` (dev-ai) or" >> "$GITHUB_STEP_SUMMARY"
          echo "\`prd/ai/litellm-internal/application.yaml\` (prd-ai)." >> "$GITHUB_STEP_SUMMARY"
